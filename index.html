<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Smart Sub Tracker: see every subscription, never pay for one you forgot." />
    <title>SubTrack</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('sst-store-v2');
          var state = raw ? JSON.parse(raw).state : null;
          var profile = state && state.profile;
          var theme = (profile && profile.theme) || 'system';
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          if (profile && profile.language) document.documentElement.lang = profile.language;
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
